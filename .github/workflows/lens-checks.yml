name: Lens geometry checks

on:
  push:
    branches: ["codex/lens-adaptive-print-mesh"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -v
      - name: Export finite-rim example at the default 1 micrometre budget
        run: python main.py --config queue/params.json --aperture-diameter-mm 180 --output lens_with_rim.stl --report lens_with_rim.json
      - uses: actions/upload-artifact@v4
        with:
          name: lens-with-finite-rim-and-metrics
          path: |
            lens_with_rim.stl
            lens_with_rim.json
          retention-days: 14
