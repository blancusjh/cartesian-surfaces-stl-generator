name: Lens geometry checks

on:
  push:
    branches: ["master", "codex/lens-adaptive-print-mesh"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -v
      - name: Build and smoke test the installed wheel outside the checkout
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m venv /tmp/lens-wheel-smoke
          /tmp/lens-wheel-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/lens-wheel-smoke/bin/cartesian-lens --config "$GITHUB_WORKSPACE/queue/lens_20mm.json" --aperture-diameter-mm 20 --output "$GITHUB_WORKSPACE/lens_20mm.stl" --report "$GITHUB_WORKSPACE/lens_20mm.json"
      - uses: actions/upload-artifact@v4
        with:
          name: lens-20mm-with-finite-rim-and-metrics
          path: |
            lens_20mm.stl
            lens_20mm.json
          retention-days: 7
